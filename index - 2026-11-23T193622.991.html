<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<meta name="theme-color" content="#FFC93C">
<title>مسابقة الكتاب المقدس</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Cairo:wght@400;600;700;800&family=Amiri:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#2A1A5E;--ink2:#5B4B97;--sun:#FFC93C;--coral:#FF5D73;--teal:#0E9F92;--violet:#7C5CF0;--mint:#D3F6EE;--line:#CFC4F2}
*{box-sizing:border-box;margin:0;font-family:Cairo,sans-serif}
h1,h2,h3,.sc{font-family:'Baloo Bhaijaan 2',Cairo,sans-serif;line-height:1.35}
body{min-height:100vh;color:var(--ink);background:radial-gradient(circle at 100% 0,#FFE9A0 0,transparent 38%),linear-gradient(180deg,#C6F3E8 0%,#E4FBF5 55%,#FFF4CF 100%);background-attachment:fixed}
[hidden]{display:none!important}
button:focus-visible,.chips span:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

/* الكروت */
.box{background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:0 7px 0 var(--ink);padding:22px;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.95)}}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}

/* اللوجو والعنوان */
#auth .lg{text-align:center;margin:18px 0 24px}
.lg img,.hl img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid var(--ink);box-shadow:0 0 0 6px var(--sun),0 0 0 9px var(--ink),0 6px 0 9px var(--ink)}
#auth .lg img{animation:drop .9s cubic-bezier(.34,1.56,.64,1) both,bob 4s ease-in-out .9s infinite}
@keyframes drop{from{opacity:0;transform:translateY(-70px) scale(.6) rotate(-20deg)}}
@keyframes bob{50%{transform:translateY(-7px) rotate(3deg)}}
.lg h1{display:inline-block;margin-top:20px;padding:2px 12px;font-size:28px;font-weight:800;color:var(--ink);background:linear-gradient(transparent 58%,var(--sun) 58% 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lg p{color:var(--ink2);font-size:14px;font-weight:600;margin-top:8px;line-height:1.7}

/* تبديل الدخول / الاشتراك */
.sw{display:flex;gap:4px;background:var(--mint);border:3px solid var(--ink);border-radius:18px;padding:4px;margin-bottom:16px}
.sw button{flex:1;border:0;background:none;padding:10px;border-radius:13px;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink2);transition:background .2s,color .2s}
.sw .on{background:var(--ink);color:var(--sun);animation:tab .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes tab{from{transform:scale(.88)}}

/* الحقول */
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--ink)}
input,select{width:100%;padding:12px 14px;border:2.5px solid var(--line);border-radius:14px;font-size:15px;background:#fff;color:var(--ink);outline:0;transition:.2s}
input:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(255,201,60,.6)}

/* الزرار الأساسي */
.pr{width:100%;margin-top:16px;padding:13px;border:3px solid var(--ink);border-radius:16px;color:var(--ink);font-size:17px;font-weight:800;cursor:pointer;background:var(--sun);box-shadow:0 5px 0 var(--ink);transition:transform .15s,box-shadow .15s,background .2s}
.pr:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink);background:#FFD65C}
.pr:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pr:disabled{opacity:.6;cursor:wait}
#st{animation:nudge 2.6s ease-in-out infinite}#st:hover{animation:none}
@keyframes nudge{0%,100%{transform:none}8%{transform:rotate(-1.5deg) scale(1.02)}16%{transform:rotate(1.5deg) scale(1.02)}24%{transform:none}}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips span{background:var(--mint);color:var(--ink);border:2px solid var(--ink);padding:3px 11px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;direction:ltr;transition:.15s}
.chips span:hover{background:var(--sun);transform:translateY(-2px) rotate(-2deg)}
.pp{display:flex;align-items:center;gap:12px}.pp img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--mint);border:3px solid var(--ink)}

/* كارت الحساب */
.idc{margin:18px 0 22px;border-radius:28px;padding:24px;color:#fff;text-align:center;background:linear-gradient(135deg,#7C5CF0,#4B2FC0);border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink);position:relative;overflow:hidden;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
.idc:before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:var(--sun);top:-95px;left:-75px}
.idc:after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:rgba(255,255,255,.22);transform:skewX(-20deg);pointer-events:none;animation:shine 3.5s ease-in-out 1s infinite}
@keyframes shine{0%{left:-80px}45%,100%{left:120%}}
.idc>*:not(.cl){position:relative;z-index:1}
.idc .cl{width:46px;height:46px;border-radius:50%;border:2.5px solid #fff;position:absolute;top:14px;right:14px;object-fit:cover;z-index:1}
.cph{width:96px;height:96px;border-radius:50%;border:4px solid #fff;object-fit:cover}
.idc h3{margin:10px 0 14px;font-size:22px}
.kv{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:10px 14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.kv b{direction:ltr;font-size:18px;letter-spacing:.5px}.idc small{display:block;margin-top:14px;font-weight:600}

/* الهيدر والتبويبات */
header{display:grid;grid-template-columns:112px 1fr 112px;align-items:center;gap:8px;margin-bottom:16px}header .ib{width:112px;justify-content:center;padding:8px 4px;white-space:nowrap}header .hl{justify-self:center}
.ib{border:2.5px solid var(--ink);background:#fff;padding:8px 14px;border-radius:30px;font-weight:800;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink);transition:transform .15s,box-shadow .15s,background .2s}
.ib:hover{background:var(--sun)}.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ib img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid var(--ink)}
.hl{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink)}
.hl img{width:42px;height:42px;border-width:2px;box-shadow:0 0 0 3px var(--sun),0 0 0 5px var(--ink)}
nav{display:flex;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:4px;margin-bottom:16px;box-shadow:0 5px 0 var(--ink)}
nav button{flex:1;border:0;background:none;padding:11px 4px;border-radius:15px;font-weight:800;font-size:15px;color:var(--ink2);cursor:pointer;transition:background .2s}
nav button:hover{background:var(--mint)}
nav .on,nav .on:hover{background:var(--coral);color:var(--ink);animation:tab .4s cubic-bezier(.34,1.56,.64,1)}

/* النص */
.txt{white-space:pre-wrap;line-height:2.1;font-size:21px;font-family:Amiri,'Traditional Arabic',serif;-webkit-text-stroke:.35px}
.vn{display:inline-block;background:var(--sun);color:var(--ink);border-radius:8px;padding:0 7px;line-height:1.5;font-family:Cairo,sans-serif;font-size:.62em;font-weight:800;-webkit-text-stroke:0;margin-inline-end:5px;vertical-align:middle}
.box h2{color:var(--ink);margin-bottom:10px;font-size:24px;font-weight:800}
.c{text-align:center}.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.tm{background:var(--mint);color:var(--ink);border:2px solid var(--ink);font-weight:800;padding:2px 14px;border-radius:20px;direction:ltr}
.tm.lo{background:var(--coral);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
.bar{height:10px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));transition:.4s}

/* الأسئلة */
.op{display:block;width:100%;text-align:right;margin-top:10px;padding:13px 16px;border:2.5px solid var(--line);background:#fff;border-radius:16px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s,background .15s}
.op:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 4px 0 var(--ink)}
.op.sel{border-color:var(--ink);background:#FFF1B8;font-weight:800;box-shadow:0 4px 0 var(--ink);animation:tap .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes tap{from{transform:scale(.96)}}
.rv{margin-top:12px;padding:12px;border-radius:14px;background:#FBFAFF;border-right:6px solid var(--line)}.rv.ok{border-color:#0E9F6E}.rv.no{border-color:#E5484D}.rh{display:flex;justify-content:space-between;gap:8px;font-weight:700}.ro{padding:7px 10px;border-radius:10px;margin-top:5px;font-size:14px;background:#fff;border:1.5px solid var(--line)}.ro.g{background:#D5F6E6;border-color:#0E9F6E;color:#0B6B45;font-weight:600}.ro.r{background:#FFE0E3;border-color:#E5484D;color:#A3202E}.rn{font-size:13px;color:#b45309;margin-top:5px;font-weight:600}
.sc,.hi b{direction:ltr;unicode-bidi:isolate}
.pb{background:var(--mint);color:var(--ink);border:2px solid var(--ink);padding:1px 10px;border-radius:20px;font-size:13px;white-space:nowrap;align-self:flex-start;font-weight:800}
.qbar{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:18px;box-shadow:0 5px 0 var(--teal);margin-bottom:8px}
.qbar .qt{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar .tm{background:var(--sun);border-color:var(--sun);color:var(--ink);flex:none}.qbar .tm.lo{background:var(--coral);border-color:var(--coral)}
.qc{background:#FBFAFF;border-radius:20px;padding:14px;margin-top:14px;border:2.5px solid var(--line)}.qc .rh{margin-bottom:4px}
.mr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:#fff;border-radius:14px;border:2px solid var(--line)}.mr span{flex:1;font-size:15px;font-weight:600}.mr select{width:auto;flex:1;min-width:0;padding:8px}
.oi{display:flex;align-items:center;gap:8px;margin-top:8px;background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:8px 10px}.oi span:nth-child(2){flex:1;font-weight:600}
.oi b{flex:none;width:26px;height:26px;display:grid;place-items:center;background:var(--sun);border-radius:50%;font-size:13px}
.mv{border:2px solid var(--ink);background:var(--mint);color:var(--ink);border-radius:10px;width:34px;height:34px;font-size:15px;cursor:pointer;margin-inline-start:4px;transition:transform .12s,background .2s}
.mv:hover{background:var(--sun)}.mv:active{transform:translateY(2px)}
.fi{width:100%;padding:10px;border:2.5px solid var(--line);border-radius:14px;font-size:16px;margin-top:8px;resize:vertical;color:var(--ink);outline:0}.fi:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(255,201,60,.6)}
.hint{font-size:12px;color:var(--ink2);margin-top:2px;font-weight:600}.rv.pd{border-color:#F59E0B}

/* التحميل والإشعارات */
.ld{text-align:center;padding:10px 0}.pgb{height:10px;background:var(--line);border-radius:8px;overflow:hidden;margin:14px auto;max-width:260px}.pgb i{display:block;width:40%;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--coral),var(--sun));position:relative;animation:pg 1.3s ease-in-out infinite}@keyframes pg{0%{right:-40%}100%{right:100%}}
#net{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--sun);color:var(--ink);border:2.5px solid var(--ink);padding:8px 18px;border-radius:30px;z-index:99;font-size:13px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.sc{width:130px;height:130px;border-radius:50%;margin:14px auto;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:var(--ink);background:var(--sun);border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);animation:score .8s cubic-bezier(.34,1.56,.64,1) both}
@keyframes score{from{opacity:0;transform:scale(.3) rotate(-180deg)}}
.ov{position:fixed;inset:0;background:rgba(42,26,94,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov .box{background:#fff;width:100%;max-width:440px;max-height:88vh;overflow:auto}
.hi{display:flex;justify-content:space-between;padding:9px 12px;background:#F3EEFF;border:2px solid var(--line);border-radius:12px;margin-top:6px;font-size:14px;font-weight:600}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border:2.5px solid var(--sun);padding:11px 20px;border-radius:30px;z-index:99;font-size:14px;font-weight:600;max-width:90%;text-align:center;animation:ti .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes ti{from{opacity:0;transform:translate(-50%,30px)}}
.spin{width:38px;height:38px;border:5px solid #E6DEFB;border-top-color:var(--coral);border-right-color:var(--sun);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}@keyframes sp{to{transform:rotate(360deg)}}

/* الخلفية المتحركة: شمس مبتسمة + أشكال طايرة */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sun{position:absolute;top:-70px;right:-70px;width:clamp(160px,28vw,230px);aspect-ratio:1}
.sun i{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#FFD65C 0 9deg,transparent 9deg 24deg);-webkit-mask:radial-gradient(circle,#000 40%,transparent 71%);mask:radial-gradient(circle,#000 40%,transparent 71%);animation:rot 40s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.sun:before{content:"";position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 36% 46%,var(--ink) 0 5%,transparent 6%),radial-gradient(circle at 64% 46%,var(--ink) 0 5%,transparent 6%),var(--sun);border:3px solid var(--ink);z-index:1;animation:sunp 3s ease-in-out infinite}
@keyframes sunp{50%{transform:scale(1.06)}}
.sun:after{content:"";position:absolute;left:41%;top:55%;width:18%;height:9%;border-bottom:3px solid var(--ink);border-radius:0 0 50px 50px;z-index:2}
.sh{position:absolute;opacity:.9;will-change:transform;animation:fl 7s ease-in-out infinite alternate}
.sh.o{border-radius:50%}
.sh.r{border-radius:50%;border:5px solid}
.sh.s{clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.sh.x{clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%)}
@keyframes fl{to{transform:translateY(-26px) rotate(25deg)}}

/* قصاصات الاحتفال بعد التسليم */
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:98}
.cf i{position:absolute;top:-24px;border-radius:2px;animation:cfall linear both}
@keyframes cfall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

@media(max-width:380px){.lg h1{font-size:24px}.box{padding:18px}}
@media(prefers-reduced-motion:reduce){.sky *,.box,.sc,.idc,.idc:after,.op,#st,.lg img,#toast,nav .on,.sw .on{animation:none!important}}
</style>
</head>
<body>
<div class="sky"><div class="sun"><i></i></div>
<i class="sh o" style="left:6%;top:24%;width:26px;height:26px;background:#FF5D73;animation-duration:6s"></i>
<i class="sh s" style="left:84%;top:38%;width:36px;height:36px;background:#FFC93C;animation-duration:8s;animation-delay:-2s"></i>
<i class="sh x" style="left:90%;top:64%;width:30px;height:30px;background:#7C5CF0;animation-duration:7s;animation-delay:-4s"></i>
<i class="sh r" style="left:4%;top:58%;width:38px;height:38px;border-color:#0E9F92;animation-duration:9s;animation-delay:-1s"></i>
<i class="sh s" style="left:14%;top:84%;width:32px;height:32px;background:#FF5D73;animation-duration:7s;animation-delay:-3s"></i>
<i class="sh o" style="left:72%;top:88%;width:22px;height:22px;background:#7C5CF0;animation-duration:6s;animation-delay:-5s"></i>
<i class="sh r" style="left:52%;top:5%;width:30px;height:30px;border-color:#FF5D73;animation-duration:8s;animation-delay:-2s"></i>
<i class="sh s" style="left:30%;top:13%;width:28px;height:28px;background:#0E9F92;animation-duration:9s;animation-delay:-6s"></i>
<i class="sh x" style="left:46%;top:93%;width:26px;height:26px;background:#FFC93C;animation-duration:7s;animation-delay:-1s"></i></div>
<div class="wrap">

<div id="load"><div class="spin"></div></div>

<!-- ===== الدخول / الاشتراك ===== -->
<div id="auth" hidden>
 <div class="lg"><img src="logo.png" alt=""><h1>مسابقة الكتاب المقدس</h1><p>خدمة فتيان إعدادي - كنيسة الشهيد العظيم مارمينا - مطرانية الأقباط الأرثوذكس بالفيوم</p></div>
 <div class="box">
  <div class="sw"><button id="tl" class="on">تسجيل الدخول</button><button id="tr">اشتراك جديد</button></div>
  <div id="fl">
   <label>اسم المستخدم</label><input id="lu" dir="ltr" autocapitalize="none">
   <label>الباسورد</label><input id="lp" type="password" dir="ltr">
   <button class="pr" id="lb">دخول</button>
  </div>
  <div id="fr" hidden>
   <label>الاسم ثلاثي (بالعربي)</label><input id="rn">
   <label>الاسم بالإنجليزي</label><input id="re" dir="ltr">
   <label>اسم المستخدم (اختار من المقترحات أو اكتب)</label><input id="ru" dir="ltr" autocapitalize="none">
   <div class="chips" id="sg"></div>
   <label>الفصل</label><select id="rg"><option>أولى إعدادي</option><option>تانية إعدادي</option><option>تالتة إعدادي</option></select>
   <label>رقم الموبايل (عليه واتساب)</label><input id="rph" type="tel" dir="ltr" placeholder="01xxxxxxxxx">
   <label>الصورة الشخصية</label>
   <div class="pp"><img id="pv" src="logo.png"><input id="ph" type="file" accept="image/*"></div>
   <label>الباسورد</label><input id="rp" type="password" dir="ltr">
   <button class="pr" id="rb">اشترك</button>
  </div>
 </div>
</div>

<!-- ===== كارت الحساب ===== -->
<div id="card" hidden>
 <div class="idc"><img src="logo.png" class="cl"><img id="cp" class="cph"><h3 id="cn"></h3>
  <div class="kv"><span>اسم المستخدم</span><b id="cu"></b></div>
  <div class="kv"><span>الباسورد</span><b id="cw"></b></div>
  <small>📸 خد سكرين شوت للكارت ده واحتفظ بيه</small></div>
 <button class="pr" id="cgo">دخول للمسابقة</button>
</div>

<!-- ===== الموقع من جوه ===== -->
<div id="app" hidden>
 <header>
  <button class="ib" id="out">⎋ خروج</button>
  <div class="hl"><img src="logo.png" alt=""></div>
  <button class="ib" id="pf"><img id="hp" src="logo.png"> حسابي</button>
 </header>
 <nav><button class="on" data-t="ch">الإصحاح</button><button data-t="tf">التفسير</button><button data-t="qz">الأسئلة</button></nav>
 <section id="ch" class="box"></section>
 <section id="tf" class="box" hidden></section>
 <section id="qz" class="box" hidden></section>
</div>
</div>

<div id="pm" class="ov" hidden><div class="box" id="pb"></div></div>
<div id="toast" hidden></div>
<div id="net" hidden>الاتصال بطيء… بيحاول تاني ⏳</div>

<script>
const API='https://script.google.com/macros/s/AKfycbxOxfeCu4THJcMmcrETdOuztOExPNEnvY02PvbmTMD5Xdx3O5PWC4Et7AmqLiM6mFFQEg/exec';   // <<< لينك Apps Script بعد النشر
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=JSON.parse(localStorage.bq||'null'),ME=null,PH='',PASS='',T;

function net(on){$('#net').hidden=!on;}
async function call(a,d={}){
  const n=a=='register'?1:3,tm=a=='register'?60000:30000;
  for(let i=0;i<n;i++){
    const c=new AbortController(),k=setTimeout(()=>c.abort(),tm);
    try{const r=await fetch(API,{method:'POST',body:JSON.stringify({a,...d}),signal:c.signal});const j=await r.json();clearTimeout(k);net(0);return j;}
    catch(e){clearTimeout(k);if(i<n-1){net(1);await new Promise(z=>setTimeout(z,1200*(i+1)));}}
  }
  net(0);return{err:'في مشكلة في الاتصال أو السيرفر مشغول، جرب تاني'};
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t.k);t.k=setTimeout(()=>t.hidden=true,3500);}
function show(id){['load','auth','card','app'].forEach(x=>$('#'+x).hidden=x!=id);}
function fmt(t){t=esc(t);const L=t.split('\n'),ne=L.filter(x=>x.trim()),st=ne.filter(x=>/^\s*[0-9٠-٩]{1,3}[\s.\-:)]/.test(x)).length;
  if(st>=ne.length/2)return L.map(x=>x.replace(/^(\s*)([0-9٠-٩]{1,3})(?=[\s.\-:)])/,'$1<b class="vn">$2</b>')).join('\n');
  return t.replace(/(^|\s)([0-9٠-٩]{1,3})(?=\s|$)/g,'$1<b class="vn">$2</b>');}
function cacheMe(){try{localStorage.bqme=JSON.stringify(ME);}catch(e){}}
function save(r){localStorage.removeItem('bqme');localStorage.removeItem('bqc');S={u:r.u,t:r.t};localStorage.bq=JSON.stringify(S);}

/* ---- بدء التشغيل: مفيش تسجيل دخول تاني طالما مخرجش ---- */
async function boot(){
  if(!S){show('auth');return;}
  let c=null;try{c=JSON.parse(localStorage.bqme||'null');}catch(e){}
  show('app');
  if(c){ME=c;$('#hp').src=c.user.photo;loadContest();return;}
  loadContest();
  const r=await call('me',S);
  if(!r.err){ME=r;cacheMe();$('#hp').src=r.user.photo;}
}

/* ---- تبويبات الدخول/الاشتراك ---- */
$('#tl').onclick=()=>{$('#tl').className='on';$('#tr').className='';$('#fl').hidden=false;$('#fr').hidden=true;};
$('#tr').onclick=()=>{$('#tr').className='on';$('#tl').className='';$('#fr').hidden=false;$('#fl').hidden=true;};
$('#lb').onclick=async()=>{
  const b=$('#lb');b.disabled=true;
  const r=await call('login',{u:$('#lu').value.trim(),pass:$('#lp').value});b.disabled=false;
  if(r.err)return toast(r.err);save(r);boot();
};
$('#ph').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const m=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240);PH=c.toDataURL('image/jpeg',.75);$('#pv').src=PH;};
  im.src=URL.createObjectURL(f);
};
$('#re').onchange=async()=>{
  const r=await call('suggest',{n:$('#re').value});if(!r.list)return;
  $('#sg').innerHTML=r.list.map(x=>`<span>${esc(x)}</span>`).join('');
  $$('#sg span').forEach(s=>s.onclick=()=>$('#ru').value=s.textContent);
  if(r.list[0]&&!$('#ru').value)$('#ru').value=r.list[0];
};
$('#rb').onclick=async()=>{
  if(!PH)return toast('اختار صورة شخصية');
  const b=$('#rb');b.disabled=true;
  const d={name:$('#rn').value,nameEn:$('#re').value,u:$('#ru').value.trim(),grade:$('#rg').value,phone:$('#rph').value,photo:PH,pass:$('#rp').value};
  const r=await call('register',d);b.disabled=false;
  if(r.err)return toast(r.err);
  save(r);$('#cp').src=PH;$('#cn').textContent=d.name;$('#cu').textContent=r.u;$('#cw').textContent=d.pass;show('card');
};
$('#cgo').onclick=boot;
$('#out').onclick=()=>{if(confirm('تسجل خروج؟')){localStorage.removeItem('bq');localStorage.removeItem('bqme');localStorage.removeItem('bqc');S=null;clearInterval(T);show('auth');}};

/* ---- التبويبات الداخلية ---- */
$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.classList.toggle('on',x==b));
  ['ch','tf','qz'].forEach(i=>$('#'+i).hidden=i!=b.dataset.t);
});

/* ---- المسابقة ---- */
const ld=m=>`<div class="ld"><div class="spin" style="margin:24px auto"></div><p>${m}</p></div>`;
function paint(r){
  $('#ch').innerHTML=`<h2>${esc(r.title)}</h2><div class="txt">${fmt(r.chapter)}</div>`;
  $('#tf').innerHTML=`<h2>تفسير ${esc(r.title)}</h2><div class="txt">${r.tafseer?fmt(r.tafseer):'التفسير هينزل قريب'}</div>`;
}
async function loadContest(){
  let cc=null;try{cc=JSON.parse(localStorage.bqc||'null');}catch(e){}
  if(cc){paint(cc);$('#qz').innerHTML=ld('جاري تحميل الأسئلة…');}
  else ['ch','tf','qz'].forEach(i=>$('#'+i).innerHTML=ld('جاري تحميل الإصحاح…'));
  const r=await call('contest',S);
  if(r.auth){localStorage.removeItem('bq');localStorage.removeItem('bqme');localStorage.removeItem('bqc');S=null;return show('auth');}
  if(r.err){
    const m=`<p class="c">${esc(r.err)}</p><button class="pr rt">إعادة المحاولة</button>`;
    if(!cc)['ch','tf'].forEach(i=>$('#'+i).innerHTML=m);$('#qz').innerHTML=m;
    $$('.rt').forEach(b=>b.onclick=loadContest);return;}
  if(r.none){localStorage.removeItem('bqc');const m='<p class="c">مفيش مسابقة مفتوحة دلوقتي 🌤️<br>استنى المسابقة الجاية</p>';['ch','tf','qz'].forEach(i=>$('#'+i).innerHTML=m);return;}
  try{localStorage.bqc=JSON.stringify({id:r.id,title:r.title,chapter:r.chapter,tafseer:r.tafseer});}catch(e){}
  paint(r);qstate(r);
}
function qstate(r){
  const q=$('#qz');
  if(r.st=='done')return fin(r);
  if(r.st=='started')return run(r.id,r.qs,r.left,r.title);
  q.innerHTML=`<div class="c"><h2>كويز ${esc(r.title)}</h2><p>عدد الأسئلة: <b>${r.n}</b></p><p>الدرجة الكلية: <b>${r.tp}</b></p><p>الوقت: <b>${r.minutes}</b> دقيقة</p>
  <p style="color:#dc2626;margin-top:8px">⚠️ لما تبدأ الوقت هيشتغل، ولازم تسلّم قبل ما يخلص، ومينفعش تعيد الكويز.</p>
  <button class="pr" id="st">ابدأ الكويز</button></div>`;
  $('#st').onclick=async()=>{
    q.innerHTML=`<div class="ld"><div class="spin" style="margin:14px auto"></div><h2>${esc(r.title)}</h2><p>جاري تجهيز الأسئلة…</p><div class="pgb"><i></i></div><small id="slow" style="color:#b45309"></small></div>`;
    const w=setTimeout(()=>{const s=$('#slow');if(s)s.textContent='الاتصال بطيء شوية، استنى ثواني ومتقفلش الصفحة…';},6000);
    const x=await call('start',{...S,id:r.id});clearTimeout(w);
    if(x.err){toast(x.err);return qstate(r);}
    x.st=='done'?fin(x):run(r.id,x.qs,x.left,r.title);
  };
}
const E=n=>Math.round(n*100)/100;
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=['#FFC93C','#FF5D73','#0E9F92','#7C5CF0','#2A1A5E'],w=document.createElement('div');w.className='cf';
  for(let i=0;i<48;i++){const p=document.createElement('i');
    p.style.cssText=`left:${Math.random()*100}%;background:${c[i%5]};width:${6+Math.random()*7}px;height:${8+Math.random()*9}px;animation-delay:${Math.random()*.7}s;animation-duration:${2+Math.random()*1.6}s;--dx:${Math.random()*160-80}px;--r:${Math.random()*720-360}deg`;
    w.appendChild(p);}
  document.body.appendChild(w);setTimeout(()=>w.remove(),4600);
}
function rvq(x,i){
  const full=x.e===x.p,a=x.a,badge=x.pend?'⏳':full?'✅':x.e>0?'🟡':'❌';let b='';
  if(x.t=='mcq'){b=x.o.map((o,k)=>`<div class="ro${k==x.c?' g':k==a?' r':''}">${k==x.c?'✓ ':k==a?'✗ ':''}${esc(o)}${k==a?' (إجابتك)':''}</div>`).join('')+(a<0?'<div class="rn">لم تجب على هذا السؤال</div>':'');}
  else if(x.t=='match'){const s=a||[];b=x.pairs.map((p,j)=>{const ok=s[j]===p[1];return `<div class="ro ${ok?'g':'r'}">${esc(p[0])} ← ${s[j]?esc(s[j]):'—'}${ok?'':'<br><small>الصح: '+esc(p[1])+'</small>'}</div>`;}).join('');}
  else if(x.t=='order'){b=(a||[]).map((v,k)=>`<div class="ro ${v===x.items[k]?'g':'r'}">${k+1}. ${esc(v)}</div>`).join('')+(full?'':'<div class="rn">الترتيب الصح: '+x.items.map(esc).join(' ← ')+'</div>');}
  else{b=`<div class="ro">${a?esc(a):'—'}</div>`+(x.pend?'<div class="rn">⏳ في انتظار تصحيح المدرس</div>':x.auto&&!full?'<div class="rn">الإجابة الصح: '+esc((x.acc||[]).join(' / '))+'</div>':'');}
  return `<div class="rv ${x.pend||(x.e>0&&!full)?'pd':full?'ok':'no'}"><div class="rh"><span>${i+1}. ${esc(x.q)}</span><span class="pb">${badge} <bdi dir="ltr">${x.pend?'?':E(x.e)} / ${x.p}</bdi></span></div>${b}</div>`;
}
function fin(r){
  clearInterval(T);
  const rv=(r.rv||[]).map(rvq).join('');
  $('#qz').innerHTML=`<div class="c"><h2>خلصت الكويز 🎉</h2><div class="sc">${E(r.score)} / ${r.total}</div><p>النتيجة اتسجلت. استنى المسابقة الجاية!</p>`+(r.pn?`<p class="rn">فيه ${r.pn} سؤال مستني تصحيح المدرس، والدرجة هتتحدّث بعد التصحيح</p>`:'')+`</div>`+(rv?`<h3 style="margin-top:14px">مراجعة إجاباتك</h3>${rv}`:'');
  call('me',S).then(m=>{if(!m.err){ME=m;cacheMe();}});
}
function run(id,qs,left,title){
  let a=qs.map(q=>q.t=='match'?q.l.map(()=>''):q.t=='order'?q.items.slice():q.t=='fill'?'':-1),tc=qs.map(()=>0),end=Date.now()+left*1000;const box=$('#qz');
  const ans=i=>{const q=qs[i],v=a[i];return q.t=='match'?v.every(x=>x):q.t=='order'?tc[i]>0:q.t=='fill'?v.trim()!='':v>=0;};
  const tick=()=>{const s=Math.max(0,Math.round((end-Date.now())/1000)),e=$('#tm');
    if(e){e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');e.classList.toggle('lo',s<60);}
    if(s<=0)send();};
  async function send(){
    clearInterval(T);box.innerHTML='<div class="spin"></div>';
    const r=await call('submit',{...S,id,ans:a});
    if(r.err){toast(r.err);return loadContest();}fin(r);confetti();
  }
  const HT={match:'وصّل كل عنصر بالإجابة المناسبة',order:'رتّب العناصر باستخدام الأسهم ▲ ▼',fill:'اكتب إجابتك'};
  const body=(q,i)=>q.t=='match'?q.l.map((l,j)=>`<div class="mr"><span>${esc(l)}</span><select class="mj" data-i="${i}" data-j="${j}"><option value="">اختر…</option>${q.r.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')}</select></div>`).join(''):
    q.t=='order'?`<div class="ord" data-i="${i}"></div>`:
    q.t=='fill'?`<textarea class="fi" data-i="${i}" rows="2"></textarea>`:
    q.o.map((o,k)=>`<button class="op" data-i="${i}" data-k="${k}">${esc(o)}</button>`).join('');
  box.innerHTML=`<div class="qbar"><span class="qt">${esc(title)}</span><span class="tm" id="tm"></span></div><p class="c" id="ac" style="font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:4px"></p>`+
   qs.map((q,i)=>`<div class="qc"><div class="rh"><span>${i+1}. ${esc(q.q)}</span><span class="pb">${q.p} درجة</span></div>${HT[q.t]?`<div class="hint">${HT[q.t]}</div>`:''}${body(q,i)}</div>`).join('')+
   `<button class="pr" id="sb">تسليم الإجابات</button>`;
  const cnt=()=>$('#ac').textContent='تمت الإجابة على '+qs.filter((_,i)=>ans(i)).length+' من '+qs.length;
  const ord=i=>{box.querySelector('.ord[data-i="'+i+'"]').innerHTML=a[i].map((x,k)=>`<div class="oi"><b>${k+1}</b><span>${esc(x)}</span><span><button class="mv" data-i="${i}" data-k="${k}" data-d="-1">▲</button><button class="mv" data-i="${i}" data-k="${k}" data-d="1">▼</button></span></div>`).join('');};
  qs.forEach((q,i)=>{if(q.t=='order')ord(i);});cnt();
  box.onclick=e=>{
    const b=e.target.closest('.op');
    if(b){const i=+b.dataset.i;a[i]=+b.dataset.k;box.querySelectorAll('.op[data-i="'+i+'"]').forEach(x=>x.classList.toggle('sel',x==b));cnt();return;}
    const m=e.target.closest('.mv');
    if(m){const i=+m.dataset.i,k=+m.dataset.k,n=k+ +m.dataset.d;if(n>=0&&n<a[i].length){[a[i][k],a[i][n]]=[a[i][n],a[i][k]];tc[i]++;ord(i);cnt();}}
  };
  box.onchange=e=>{const s=e.target.closest('.mj');if(s){a[+s.dataset.i][+s.dataset.j]=s.value;cnt();}};
  box.oninput=e=>{const t=e.target.closest('.fi');if(t){a[+t.dataset.i]=t.value;cnt();}};
  $('#sb').onclick=()=>{const m=qs.filter((_,i)=>!ans(i)).length;if(confirm(m?'لسه '+m+' سؤال من غير إجابة. تسلّم كده؟':'تسليم الإجابات؟'))send();};
  clearInterval(T);T=setInterval(tick,300);tick();
}

/* ---- البروفايل ---- */
function prof(){
  const u=ME.user;
  $('#pb').innerHTML=`<div class="c"><img src="${u.photo}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);box-shadow:0 0 0 5px var(--sun)">
  <button class="ib" id="chp" style="margin:10px auto 0">📷 تغيير الصورة</button><input type="file" id="pfile" accept="image/*" hidden>
  <h2 style="margin-top:8px">${esc(u.name)}</h2><p dir="ltr">@${esc(u.username)}</p><p>${esc(u.grade)}</p>
  <div class="sc" style="width:110px;height:110px;font-size:24px">${ME.total} / ${ME.max}</div><p>مجموع نقاطك</p></div>
  <h3 style="margin:14px 0 4px">المسابقات اللي فاتت</h3>`+
  (ME.hist.length?ME.hist.slice().reverse().map(h=>`<div class="hi"><span>${esc(h.title)}</span><b>${h.score} / ${h.total}</b></div>`).join(''):'<p class="c">لسه ما شاركتش في مسابقات</p>')+
  `<button class="pr" id="pc">إغلاق</button><p class="c" style="font-size:11px;color:var(--ink2);margin-top:8px">إصدار 7</p>`;
  $('#pc').onclick=()=>$('#pm').hidden=true;
  $('#chp').onclick=()=>$('#pfile').click();
  $('#pfile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;$('#chp').textContent='جاري الحفظ...';
    const im=new Image();
    im.onload=async()=>{const c=document.createElement('canvas');c.width=c.height=240;const m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240);const ph=c.toDataURL('image/jpeg',.75);
      const r=await call('setPhoto',{...S,photo:ph});
      if(r.err){toast(r.err);return prof();}
      ME.user.photo=ph;cacheMe();$('#hp').src=ph;prof();toast('تم تغيير الصورة ✅');};
    im.onerror=()=>{toast('الصورة غير صالحة');prof();};
    im.src=URL.createObjectURL(f);
  };
}
$('#pf').onclick=()=>{
  if(ME)prof();else $('#pb').innerHTML=ld('جاري التحميل…');
  $('#pm').hidden=false;
  call('me',S).then(m=>{if(!m.err){ME=m;cacheMe();if(!$('#pm').hidden)prof();}else if(!ME){$('#pm').hidden=true;toast(m.err);}});
};
$('#pm').onclick=e=>{if(e.target.id=='pm')$('#pm').hidden=true;};

boot();
</script>
</body>
</html>
