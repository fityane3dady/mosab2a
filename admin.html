<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الأدمن - مسابقة الكتاب المقدس</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--a:#0ea5e9;--b:#2563eb;--t:#0c2a4d}
*{box-sizing:border-box;margin:0;font-family:Cairo,sans-serif}
body{min-height:100vh;color:var(--t);background:linear-gradient(160deg,#e0f7ff,#bfe3ff 55%,#dbeafe);background-attachment:fixed;padding:16px}
[hidden]{display:none!important}
.w{max-width:760px;margin:0 auto}
.box{background:rgba(255,255,255,.8);border:1px solid #fff;border-radius:22px;box-shadow:0 10px 40px rgba(37,99,235,.15);padding:20px;margin-bottom:16px}
h1{text-align:center;color:var(--b);margin:8px 0 16px}h2{color:var(--b);margin-bottom:10px}
img.lg{display:block;margin:0 auto;width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid #0284c7;box-shadow:0 0 0 3px rgba(14,165,233,.25),0 8px 24px rgba(14,165,233,.45)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:#1e4b80}
input,select,textarea{width:100%;padding:11px 13px;border:2px solid #d4ebfb;border-radius:12px;font-size:15px;background:#fff;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--a)}textarea{min-height:130px;resize:vertical}
.pr,.sm{border:0;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b))}
.pr{width:100%;margin-top:14px;padding:12px;font-size:16px}
.sm{padding:6px 12px;font-size:13px}.sm.r{background:#ef4444}.sm.g{background:#64748b}
.q{background:#f0f9ff;border-radius:14px;padding:12px;margin-top:10px}.q input{margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;background:#f0f9ff;border-radius:12px;margin-top:8px;flex-wrap:wrap}
.bd{font-size:12px;padding:2px 10px;border-radius:20px;background:#dcfce7;color:#15803d}.bd.x{background:#e2e8f0;color:#64748b}
.ac{display:flex;gap:6px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #e0f2fe;text-align:right}
.ov{overflow-x:auto}.or{display:flex;gap:8px;align-items:center;margin-top:6px}.or input[type=radio]{width:22px;height:22px;padding:0;flex:none;margin:0}.or .oo{margin:0}
</style>
</head>
<body>
<div class="w">
<img class="lg" src="logo.png" alt=""><h1>لوحة الأدمن</h1>

<div id="lg" class="box">
 <label>باسورد الأدمن</label><input id="pw" type="password" dir="ltr">
 <button class="pr" id="go">دخول</button>
</div>

<div id="main" hidden>
 <div class="box">
  <h2 id="ft">➕ مسابقة جديدة</h2>
  <label>عنوان الإصحاح (مثال: إنجيل يوحنا - الإصحاح 3)</label><input id="ti">
  <label>نص الإصحاح (انسخه والصقه)</label><textarea id="ch"></textarea>
  <label>التفسير</label><textarea id="tf"></textarea>
  <label>وقت الكويز (بالدقايق)</label><input id="mn" type="number" value="5" min="1">
  <label>📋 الصق أسئلة (السؤال في سطر واختياراته في الأسطر اللي تحته، وسطر فاضي بين كل سؤال)</label>
  <textarea id="pt" style="min-height:110px" placeholder="الصق هنا..."></textarea>
  <div class="or"><label style="margin:0">الدرجة لكل سؤال</label><input id="pd" type="number" min="1" value="1" style="width:80px"><button class="sm" id="pa" style="margin-right:auto">إضافة الأسئلة المنسوخة</button></div>
  <div id="qs"></div>
  <button class="sm g" id="aq" style="margin-top:10px">+ إضافة سؤال</button>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pub" style="width:auto" checked> انشر فورًا (هيقفل المسابقة الحالية)</label>
  <button class="pr" id="sv">حفظ المسابقة</button>
  <button class="pr" id="cn" hidden style="background:#64748b">إلغاء التعديل</button>
 </div>
 <div class="box"><h2>📚 المسابقات</h2><div id="cl"></div></div>
 <div class="box"><h2>👦 المشتركين (<span id="uc">0</span>)</h2><div class="ov"><table id="ul"></table></div></div>
</div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbxOxfeCu4THJcMmcrETdOuztOExPNEnvY02PvbmTMD5Xdx3O5PWC4Et7AmqLiM6mFFQEg/exec';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let P=sessionStorage.ap||'',EID=null,QN=0;
async function call(a,d={}){
  try{return await (await fetch(API,{method:'POST',body:JSON.stringify({a,p:P,...d})})).json();}
  catch(e){return{err:'مشكلة في الاتصال'};}
}
async function load(){
  const r=await call('adminList');
  if(r.err){sessionStorage.removeItem('ap');$('#lg').hidden=false;$('#main').hidden=true;if(P)alert(r.err);return;}
  $('#lg').hidden=true;$('#main').hidden=false;
  $('#cl').innerHTML=r.contests.length?r.contests.map(c=>`<div class="row"><div><b>${esc(c.title)}</b> <span class="bd ${c.active?'':'x'}">${c.active?'مفتوحة':'مقفولة'}</span><br><small>${c.n} سؤال - شارك ${c.parts}</small></div>
   <div class="ac"><button class="sm" style="background:#f59e0b" onclick="ed(${c.id})">تعديل</button>${c.active?`<button class="sm g" onclick="st(${c.id},0)">قفل</button>`:`<button class="sm" onclick="st(${c.id},1)">نشر</button>`}<button class="sm r" onclick="dl(${c.id})">حذف</button></div></div>`).join(''):'<p>لسه مفيش مسابقات</p>';
  $('#uc').textContent=r.users.length;
  $('#ul').innerHTML='<tr><th>الاسم</th><th>اليوزر</th><th>الفصل</th><th>الموبايل</th><th>النقاط</th></tr>'+
   r.users.map(u=>`<tr><td>${esc(u.name)}</td><td dir="ltr">${esc(u.username)}</td><td>${esc(u.grade)}</td><td dir="ltr">${esc(u.phone)}</td><td>${u.total}</td></tr>`).join('');
}
$('#go').onclick=()=>{P=$('#pw').value;sessionStorage.ap=P;load();};
async function st(id,on){const r=await call('adminSet',{id,on});r.err?alert(r.err):load();}
async function dl(id){if(!confirm('حذف المسابقة نهائيًا؟'))return;const r=await call('adminDel',{id});r.err?alert(r.err):load();}

function addQ(q){
  q=q||{q:'',o:[],c:0,p:1};const n='r'+(++QN),d=document.createElement('div'),o=q.o.slice();d.className='q';
  while(o.length<4)o.push('');
  d.innerHTML='<input class="qq" placeholder="نص السؤال"><label>الاختيارات (علّم على الإجابة الصح)</label>'+
   o.map((_,i)=>`<div class="or"><input type="radio" name="${n}"${q.c==i?' checked':''}><input class="oo" placeholder="اختيار ${i+1}"></div>`).join('')+
   `<div class="or" style="margin-top:8px"><label style="margin:0">الدرجة</label><input class="pp" type="number" min="1" value="${q.p||1}" style="width:80px"><button class="sm r" style="margin-right:auto" onclick="this.closest('.q').remove()">حذف السؤال</button></div>`;
  d.querySelector('.qq').value=q.q;d.querySelectorAll('.oo').forEach((x,i)=>x.value=o[i]);$('#qs').appendChild(d);
}
function collect(){
  const out=[];
  for(const b of document.querySelectorAll('.q')){
    const t=b.querySelector('.qq').value.trim(),o=[];let c=-1;
    b.querySelectorAll('.or').forEach(r=>{const x=r.querySelector('.oo');if(!x)return;const v=x.value.trim();if(!v)return;if(r.querySelector('input[type=radio]').checked)c=o.length;o.push(v);});
    if(!t&&!o.length)continue;
    if(!t||o.length<2)throw 'كمّل السؤال واختيارين على الأقل';
    if(c<0)throw 'علّم الإجابة الصح في سؤال: '+t;
    out.push({q:t,o,c,p:Math.max(1,+b.querySelector('.pp').value||1)});
  }
  return out;
}
/* ---- تحليل الأسئلة المنسوخة ---- */
function parse(t){
  const clean=x=>x.replace(/[*#]/g,'').trim(),MK=/[✅✔☑]|\(صح\)|\(correct\)/gi;
  const blocks=t.replace(/\r/g,'').split(/\n\s*\n/).map(b=>b.split('\n').map(x=>x.trim()).filter(Boolean)).filter(b=>b.length>=3);
  return blocks.map(b=>{
    let ans=null;const L=[];
    b.forEach(x=>{const m=x.match(/^[*#\s]*(?:الإجابة|الاجابة|الجواب|الاجابه|answer)[^:：]*[:：]\s*(.+)$/i);if(m)ans=clean(m[1].replace(MK,''));else L.push(x);});
    const q=clean(L[0]).replace(/^(?:سؤال\s*)?[0-9٠-٩]+\s*[.\-:)]\s*/,'').replace(/^سؤال\s*[:：]\s*/,'');
    let c=-1;
    const o=L.slice(1).map((x,i)=>{
      const ok=/[✅✔☑]|\(صح\)|\(correct\)/i.test(x);
      x=clean(x.replace(MK,'')).replace(/^(?:[-•●▪]\s*|\(?(?:[أ-ي]|[a-dA-D]|[0-9٠-٩]{1,2})\s*[.)\-:]\s*)/,'');
      if(ok&&c<0)c=i;return x;
    });
    if(ans&&c<0){
      const m=ans.match(/^\(?([أبجدabcd1-4١-٤])\)?(?:[\s.\-:)]|$)/i);
      if(m){const k=m[1].toLowerCase();c=Math.max('أبجد'.indexOf(k),'abcd'.indexOf(k),'1234'.indexOf(k),'١٢٣٤'.indexOf(k));}
      if(c<0)c=o.findIndex(x=>x&&(ans.includes(x)||x.includes(ans)));
    }
    return{q,o,c:c<0?0:c};
  });
}
$('#pa').onclick=()=>{
  const r=parse($('#pt').value),p=Math.max(1,+$('#pd').value||1);
  if(!r.length)return alert('مفيش أسئلة اتعرفت. تأكد إن السؤال في سطر واختياراته تحته (على الأقل اختيارين) وفي سطر فاضي بين كل سؤال.');
  document.querySelectorAll('.q').forEach(b=>{if(!b.querySelector('.qq').value.trim()&&![...b.querySelectorAll('.oo')].some(x=>x.value.trim()))b.remove();});
  r.forEach(q=>addQ({...q,p}));$('#pt').value='';
  alert('اتضاف '+r.length+' سؤال ✅ راجع الإجابة الصح لكل سؤال (الافتراضي الأول).');
};
$('#aq').onclick=()=>addQ();addQ();

function reset(){EID=null;['ti','ch','tf'].forEach(i=>$('#'+i).value='');$('#mn').value=5;$('#qs').innerHTML='';addQ();$('#pub').checked=true;$('#ft').textContent='➕ مسابقة جديدة';$('#sv').textContent='حفظ المسابقة';$('#cn').hidden=true;}
async function ed(id){
  const r=await call('adminGet',{id});if(r.err)return alert(r.err);const c=r.c;
  EID=id;$('#ti').value=c.title;$('#ch').value=c.chapter;$('#tf').value=c.tafseer;$('#mn').value=c.minutes;
  $('#qs').innerHTML='';c.questions.forEach(q=>addQ(q));$('#pub').checked=false;
  $('#ft').textContent='✏️ تعديل: '+c.title;$('#sv').textContent='حفظ التعديلات';$('#cn').hidden=false;scrollTo({top:0,behavior:'smooth'});
}
$('#cn').onclick=reset;
$('#sv').onclick=async()=>{
  let questions;try{questions=collect();}catch(e){return alert(e);}
  const b=$('#sv');b.disabled=true;
  const body={pub:$('#pub').checked,c:{title:$('#ti').value.trim(),chapter:$('#ch').value.trim(),tafseer:$('#tf').value.trim(),minutes:$('#mn').value,questions}};
  const r=EID?await call('adminUpdate',{...body,id:EID}):await call('adminSave',body);
  b.disabled=false;if(r.err)return alert(r.err);
  alert('تم الحفظ ✅');reset();load();
};
if(P)load();
</script>
</body>
</html>
